<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Confirmation-Madar</title>
    <!-- fav icon -->
    <link rel="icon" href="assets/images/favicon.jpg" />
    <!-- bootstrap css -->
    <link rel="stylesheet" href="assets/css/bootstrap.min.css" />
    <!-- Bg style -->
    <link rel="stylesheet" href="assets/css/stars-bg.css" />
    <!-- main style -->
    <link rel="stylesheet" href="assets/css/style.css" />
    <link rel="stylesheet" href="assets/css/10-confirm.css" />
    <!-- google fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400..700&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Caacupe+One&family=Comic+Relief:wght@400;700&family=Dancing+Script:wght@400..700&family=Exo+2:ital,wght@0,100..900;1,100..900&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Reem+Kufi:wght@400..700&display=swap"
      rel="stylesheet"
    />
    <!-- font awesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css"
      integrity="sha512-x9WwyMYBnlXMNQ6kQ/Lyzu1NqIhLQKL5Oq6xByfXuRj7s9CskyCbLv/1IjqzJmXwFXWr0ov6jBV7Qbc0hh9nHg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
  </head>
  <body class="confirm-body">
    <section
      class="confirmation-section d-flex align-items-center justify-content-center text-center py-5"
    >
      <div class="container">
        <div class="row justify-content-center">
          <div class="col-lg-8">
            <div class="confirm-rocket-wrapper mb-4">
              <img
                src="assets/images/shimaa_images/ro-removebg-preview.png"
                alt="confirm"
                class="confirm-rocket"
              />
            </div>

            <div class="p-4 p-md-5">
              <div
                class="status-badge mb-3 d-inline-block px-3 py-1 rounded-pill"
              >
                <i class="fas fa-check-circle me-1 text-warning"></i>
                Transmission Received
              </div>

              <h1 class="text-white fw-bold display-5 mb-3">
                Signal Broadcasted Successfully
              </h1>

              <p class="text-light opacity-75 fs-5 mb-4">
                Your message has traveled through the cosmos and landed safely
                in our orbit. Our space terminal will process it shortly.
              </p>

              <!-- shimaaaaa Quote :| -->
              <div class="my-4">
                <p class="shimaa-gold-text">"stay alive, kid."</p>
              </div>

              <!-- back to home -->
              <a
                href="index.html"
                class="btn main-btn rounded-pill fw-bold px-4 py-2 mt-2"
              >
                <i class="fas fa-arrow-left me-2"></i> Return To Madar
              </a>
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- bootstrap js -->
    <script src="assets/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
